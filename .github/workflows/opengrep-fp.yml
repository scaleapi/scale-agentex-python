name: OpenGrep FP Triage

on:
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  id-token: write

jobs:
  triage:
    if: |
      (startsWith(github.event.comment.body, '/fp') ||
       startsWith(github.event.comment.body, '/FP')) &&
      !endsWith(github.actor, '[bot]')
    uses: scaleapi/required-actions/.github/workflows/opengrep-fp.yml@main
    secrets: inherit
