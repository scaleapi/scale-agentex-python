[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s080-lineage"
version = "0.1.0"
description = "A sync agent whose tool calls carry lineage data-source refs and an agent version"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentex-sdk>=0.25.0",
    "scale-gp",
    "openai-agents",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "black",
    "isort",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
